services:
  backend:
    build: .
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - faiss_data:/app/faiss_indexes
      - hf_cache:/root/.cache/huggingface

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  faiss_data:
  hf_cache:
