name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only torch first to keep the install small
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt pytest httpx
      - name: Run tests (offline, LLMs and embeddings are stubbed)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 27 pre-existing lint errors (mostly unused `React` imports); tracked separately
      - run: npm run lint --if-present
        continue-on-error: true
      - run: npm run build
